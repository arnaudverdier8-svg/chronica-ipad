<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<!-- Gabarit HTML de l'export Web (iPad, Safari). Plein écran, pas de zoom ni
     de défilement de page : tous les gestes vont au jeu (view/camera_rig.gd). -->
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Chronica">
<meta name="theme-color" content="#e8dcc4">
<meta name="format-detection" content="telephone=no">
<title>Chronica</title>
<style>
html, body {
	margin: 0; padding: 0; border: 0;
	/* (100vh, pas 100% : avec viewport-fit=cover et la barre d'état
	   translucide, 100% empêche la page de passer sous l'encoche en mode
	   « écran d'accueil » ; 100vh est la seule valeur juste dès le départ) */
	width: 100%; height: 100vh;
	overflow: hidden;
	overscroll-behavior: none;
	touch-action: none;
	-webkit-user-select: none; user-select: none;
	-webkit-touch-callout: none;
	-webkit-tap-highlight-color: transparent;
	-webkit-text-size-adjust: 100%;
	background: #e8dcc4;
}
body { position: fixed; inset: 0; }
#canvas {
	display: block; position: absolute; inset: 0;
	width: 100%; height: 100%;
	touch-action: none; outline: none;
}
/* L'écran de chargement : du lin, un titre brodé, un fil qui avance. */
#status {
	position: absolute; inset: 0;
	display: flex; flex-direction: column; justify-content: center; align-items: center;
	background:
		repeating-linear-gradient(0deg, rgba(120, 96, 60, 0.05) 0 1px, transparent 1px 3px),
		repeating-linear-gradient(90deg, rgba(120, 96, 60, 0.05) 0 1px, transparent 1px 3px),
		#e8dcc4;
	color: #4a3a28;
	font-family: Georgia, 'Times New Roman', serif;
	transition: opacity 0.5s ease;
}
#status h1 {
	margin: 0 0 0.3em; font-weight: normal; font-size: 3.2rem;
	letter-spacing: 0.18em; color: #7a2a22;
}
#status #logo { width: min(78vw, 560px); height: auto; margin: 0 0 0.6em; pointer-events: none; }
#status p { margin: 0 0 2em; font-style: italic; opacity: 0.75; }
#bar {
	width: min(46vw, 420px); height: 6px;
	border: 1px dashed #8a6c44; border-radius: 3px; padding: 2px;
}
#fill { height: 100%; width: 0; background: #7a2a22; border-radius: 2px; transition: width 0.2s; }
#notice { display: none; margin-top: 2em; max-width: 70vw; text-align: center; color: #7a2a22; }
/* Les marges de l'encoche (lues par window.chronicaDevice). */
#safe {
	position: fixed; inset: 0; visibility: hidden; pointer-events: none;
	padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
/* Un téléphone tenu en portrait : le jeu se joue en paysage. */
#rotate {
	display: none; position: fixed; inset: 0; z-index: 10;
	flex-direction: column; justify-content: center; align-items: center;
	background: #2a1a10; color: #e8dcc4; text-align: center;
	font-family: Georgia, 'Times New Roman', serif; padding: 2em;
}
#rotate h2 { margin: 0 0 0.6em; font-weight: normal; letter-spacing: 0.12em; color: #d8b04e; }
#rotate .phone {
	width: 46px; height: 80px; border: 3px solid #d8b04e; border-radius: 9px;
	margin-bottom: 1.4em; animation: turn 2.4s ease-in-out infinite;
}
@keyframes turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
@media (orientation: portrait) and (max-width: 600px) {
	#rotate { display: flex; }
}
</style>
<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

</head>

<script>
// LE SON SUR IPAD. Godot réveille son AudioContext pendant un « touchstart »,
// que Safari iOS ne compte pas comme un geste qui autorise le son : le
// contexte restait suspendu (ni musique ni bruitages). On garde la main sur
// chaque contexte créé et on le réveille au geste que Safari accepte (doigt
// relevé, clic, touche), en jouant au passage un tampon muet (le déblocage
// classique de WebKit). Et la session audio passe en « lecture » (iPadOS 17 :
// audioSession ; avant : un <audio> muet en boucle) : le mode silencieux de
// l'appareil ne coupe plus la musique d'un jeu. Le jeu mixe à 48 kHz sur le
// web (project.godot), le débit natif de l'iPad.
// SURTOUT : project.godot met le web en lecture « Stream »
// (audio/general/default_playback_type.web=0). En mode « Sample » (le défaut
// de Godot 4.3+ sans threads), les lecteurs croyaient jouer mais rien
// n'atteignait le haut-parleur, sur aucun appareil (mesuré : niveau 0.0000
// sur tout ce qui va à la sortie).
// L'APPAREIL (ui/device.gd) : un téléphone (le petit côté de l'écran sous
// 600 px CSS, au doigt), et les marges de l'encoche en px CSS.
//
// L'ENCOCHE ET L'ÎLE DYNAMIQUE (iPhone, paysage). Trois précautions, tirées de
// ce que font les jeux web qui tiennent sur iPhone :
//  1. viewport-fit=cover (plus haut) : sans lui, env(safe-area-inset-*) vaut 0
//     et Safari laisse des bandes vides ;
//  2. les valeurs de env() sont lues d'une sonde en pixels (#safe), RELUES
//     (Godot les redemande chaque seconde, et à chaque rotation) car WebKit
//     les donne parfois à 0 ou en retard à froid (bogues WebKit 274773,
//     191872) ;
//  3. un PLANCHER : un iPhone à encoche (écran de plus de 2:1) en paysage ne
//     descend jamais sous 47 px de chaque côté et 21 px en bas, même si env()
//     répond 0. iOS donne des marges SYMÉTRIQUES (59 px avec l'île, 47 avec
//     l'encoche, 62 sur les Pro Max), quel que soit le côté de la caméra.
window.chronicaDevice = function () {
	var touch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
	var small = Math.min(screen.width, screen.height) < 600;
	var phone = touch && small;
	var cs = getComputedStyle(document.getElementById('safe'));
	var px = function (v) { return parseFloat(v) || 0; };
	var l = px(cs.paddingLeft), t = px(cs.paddingTop), r = px(cs.paddingRight), b = px(cs.paddingBottom);
	var w = window.innerWidth, h = window.innerHeight;
	var long = Math.max(screen.width, screen.height), short = Math.min(screen.width, screen.height);
	if (phone && /iPhone/.test(navigator.userAgent) && w > h && long / short > 2.0) {
